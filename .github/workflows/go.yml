name: Go

on:
  pull_request:
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - ".golangci.yml"
      - "Makefile"
      - ".vscode/extensions.json"
      - ".vscode/settings.json"
      - ".vscode/tasks.json"
      - ".github/workflows/go.yml"
  push:
    branches: ["main"]
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - ".golangci.yml"
      - "Makefile"
      - ".vscode/extensions.json"
      - ".vscode/settings.json"
      - ".vscode/tasks.json"
      - ".github/workflows/go.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache: true
      - name: Install pinned Go tools
        run: make go-tools
      - name: Run Go gate
        run: make go-check
