# Release workflow (adr-0017, wired at MS-5 as planned): pushing a version tag
# builds the distribution and publishes a GitHub Release with the artifacts
# attached. PyPI publishing is deliberately out of scope (adr-0017). Additive
# workflow — not part of the standard-owned check.yml twin (conventions #8).
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      # setup-uv reads .python-version itself; it has no python-version-file
      # input (the v1.0.0 run warned on and ignored one).
      # SHA-pinned like check.yml: this job publishes artifacts with
      # `contents: write`, so it must be at least as supply-chain hardened
      # as the check job (first-party actions/* stay on tags, same as there).
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: Validate release identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$GITHUB_REF_NAME" = "v$version"
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Sync dependencies
        run: uv sync --locked --all-groups

      - name: Run verification gate
        run: |
          uv run ruff format --check .
          uv run ruff check .
          uv run basedpyright
          uv run coverage run -m pytest
          uv run coverage report
          uv run pip-audit

      - name: Build sdist + wheel
        run: uv build

      - name: Smoke-test the built wheel
        shell: bash
        run: |
          set -euo pipefail
          uv run --isolated --no-project --with dist/*.whl docmend --version
          smoke_dir="$(mktemp -d)"
          trap 'rm -rf "$smoke_dir"' EXIT
          printf 'release smoke\n' > "$smoke_dir/document.md"
          uv run --isolated --no-project --with dist/*.whl docmend scan "$smoke_dir"
          uv run --isolated --no-project --with dist/*.whl docmend plan "$smoke_dir"
          uv run --isolated --no-project --with dist/*.whl docmend verify "$smoke_dir"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "docmend $GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes
